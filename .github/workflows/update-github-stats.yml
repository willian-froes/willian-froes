name: Atualizar métricas do GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar SVGs com a API GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: willian-froes
        run: node scripts/update-github-stats.cjs
      - name: Salvar métricas atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-stats.json assets/github-activity.svg assets/github-languages.svg
          git diff --cached --quiet || git commit -m "chore: atualiza métricas do GitHub"
          git push
