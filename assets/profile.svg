<svg
  fill="none"
  width="100%"
  height="706px"
  xmlns="http://www.w3.org/2000/svg"
>
  <foreignObject width="100%" height="706px">
    <div
      xmlns="http://www.w3.org/1999/xhtml"
      style="width:100%;height:706px;"
    >
      <style>
        .wrapper,
        .wrapper * {
          box-sizing: border-box;
        }

        .wrapper {
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          font-family:
            "JetBrains Mono",
            "Fira Code",
            "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            monospace;
        }

        .header {
          display: flex;
          background-color: #10131a;
          gap: 10px;
          padding: 0 16px;
          align-items: center;
          height: 46px;
          border: 1px solid #242948;
          border-radius: 6px 6px 0 0;
          flex-shrink: 0;
        }

        .window {
          display: flex;
          flex-direction: column;
          background-color: transparent;
          border: 1px solid #242948;
          border-radius: 0 0 6px 6px;
          padding: 24px;
          gap: 16px;
          flex-shrink: 0;
        }

        .btn {
          width: 14px;
          height: 14px;
          min-width: 14px;
          flex-shrink: 0;
          border-radius: 50%;
          border: none;
          display: block;
        }

        .btn-close {
          background-color: #ff2b46;
        }

        .btn-minimize {
          background-color: #ffc300;
        }

        .btn-maximize {
          background-color: #00dd48;
        }

        .text {
          font-size: 14px;
        }

        .text-profile {
          color: #7e8bad;
          white-space: nowrap;
        }

        .text-command {
          font-weight: bold;
          color: #00d5fe;
          height: 20px;
          line-height: 20px;
          flex-shrink: 0;
        }

        .text-welcome {
          display: block;
          flex-shrink: 0;
          height: 80px;
          font-size: clamp(24px, 4vw, 32px);
          line-height: 40px;
          font-weight: 900;
          color: #e5ebfa;
        }

        .text-employee {
          display: block;
          flex-shrink: 0;
          height: 48px;
          font-size: clamp(13px, 2vw, 16px);
          line-height: 24px;
          color: #8694b8;
        }

        .container {
          display: flex;
          flex-direction: column;
          flex-shrink: 0;
          gap: 12px;
        }

        .stack {
          display: grid;
          grid-template-columns: 180px minmax(0, 1fr);
          column-gap: 34px;
          align-content: start;
          height: 74px;
          flex-shrink: 0;
          font-size: 14px;
          line-height: 24px;
        }

        .stack-name {
          height: 24px;
          font-weight: bold;
        }

        .stack-name--front {
          color: #4506f6;
        }

        .stack-name--search {
          color: #ff1d00;
        }

        .stack-name--pulls {
          color: #9500fa;
        }

        .stack-name--reviews {
          color: #f2008b;
        }

        .stack-name--hobbies {
          color: #00d5fe;
        }

        .stack-name::before {
          content: "$ ";
        }

        .stack-techs {
          min-width: 0;
          color: #e1e8f6;
          overflow-wrap: anywhere;
          height: 48px;
        }

        .metric {
          color: #00dd48;
          font-weight: bold;
        }

        @media (max-width: 600px) {
          .window {
            padding: 24px 16px;
          }

          .stack {
            grid-template-columns: minmax(0, 1fr);
          }
        }
      </style>

      <div class="wrapper">
        <div class="header">
          <div class="btn btn-close"></div>
          <div class="btn btn-minimize"></div>
          <div class="btn btn-maximize"></div>

          <span class="text text-profile">
            willian@github ~
          </span>
        </div>

        <div class="window">
          <span class="text text-command">
            willian@github: ~$ ./perfil
          </span>

          <div class="container">
            <span class="text text-welcome">
              Olá, me chamo Willian Froes! 👋
            </span>

            <span class="text text-employee">
              Desenvolvedor de Software • Designer UX/UI
            </span>
          </div>

          <div class="container">
            <div class="stack">
              <span class="stack-name stack-name--front">
                tecnologias
              </span>
              <span class="stack-techs">
                React • React Native • TypeScript • Figma • Flask
              </span>
            </div>

            <div class="stack">
              <span class="stack-name stack-name--search">
                pesquisando
              </span>
              <span class="stack-techs">
                Visão Computacional • Computação Gráfica • IA
              </span>
            </div>

            <div class="stack">
              <span class="stack-name stack-name--pulls">
                pull requests
              </span>
              <span class="stack-techs">
                <strong class="metric">5</strong> mergeados
              </span>
            </div>

            <div class="stack">
              <span class="stack-name stack-name--reviews">
                code reviews
              </span>
              <span class="stack-techs">
                <strong class="metric">0</strong> aceitos / 0 rejeitados
              </span>
            </div>

            <div class="stack">
              <span class="stack-name stack-name--hobbies">
                além do código
              </span>
              <span class="stack-techs">
                Amigos • Moto • Arte • Guitarra • Videogames
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
