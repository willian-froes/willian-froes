<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:xhtml="http://www.w3.org/1999/xhtml"
  width="124"
  height="40"
  viewBox="0 0 124 40"
  role="img"
  aria-label="Portfólio">

  <style>
    .button {
      transition: filter 180ms ease;
    }

    .button:hover {
      filter: brightness(0.85);
      cursor: pointer;
    }
  </style>

  <foreignObject x="0" y="0" width="124" height="40">
    <xhtml:div xmlns="http://www.w3.org/1999/xhtml"
      style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">

      <xhtml:div class="button" style="
        box-sizing:border-box;
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        padding:0 16px;
        border:1px solid #242948;
        border-radius:10px;
        background:#020617;
        color:#f8fafc;
        font-family:Arial,Helvetica,sans-serif;
        font-size:14px;
        font-weight:700;
        letter-spacing:.2px;
        white-space:nowrap;
        overflow:hidden;">
        <svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 24 24"
    aria-hidden="true">
    <image
      href="data:image/webp;base64,"
      x="0"
      y="0"
      width="24"
      height="24"
      preserveAspectRatio="xMidYMid meet"
    />
  </svg>
        <xhtml:span>Portfólio</xhtml:span>
      </xhtml:div>

    </xhtml:div>
  </foreignObject>
</svg>