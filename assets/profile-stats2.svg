<svg
  fill="none"
  width="100%"
  height="300px"
  xmlns="http://www.w3.org/2000/svg"
>
  <foreignObject width="100%" height="100%">
    <div
      xmlns="http://www.w3.org/1999/xhtml"
      style="width: 100%; height: 100%;"
    >
      <style>
        .wrapper {
          display: flex;
          flex-direction: column;
          padding: 12px;
          gap: 16px;
          font-family:
            "JetBrains Mono",
            "Fira Code",
            "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            monospace;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stats-header {
            display: flex;
            flex-direction: row;
            width: 100%;
            justify-content: space-between;
        }

        .stats-text {
          font-size: 14px;
        }

        .stats-description {
            color: #bbc7d2;
        }

        .stats-value {
            color: green;
            font-weight: bold;
        }

        .stats-progress {
          width: 100%;
          border: none;
          border-radius: 8px;
        }

        .stats-classification-progress-bar {
          width: 68px;
          height: 68px;
          display: grid;
          place-items: center;
          border-radius: 50%;
          background:
            radial-gradient(closest-side, #10131a 79%, transparent 80% 100%),
            conic-gradient(#00b8fb 75%, gray 0);
        }

        .stats-classification-progress-bar span {
          color: #d1d3dc;
          font-family: "JetBrains Mono", "Fira Code", monospace;
          font-size: 20px;
          font-weight: 700;
        }

        .stats-classification-progress-bar progress {
          display: none;
        }

        .commits {
          display: flex;
          flex-direction: row;
          width: 100%;
          justify-content: space-between;
        }

        .commits-details {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .commits-text {
          font-size: 14px;
        }

        .commits-title {
          text-transform: uppercase;
          color: #bbc7d2;
        }

        .commits-count {
          color: #6fbde5;
          font-weight: bold;
        }

        .commits-sequence {
          color: #00f97a;
        }
      </style>

      <div class="wrapper">
        <div class="commits">
          <div class="commits-details">
            <span class="commits-text commits-title">Contribuições</span>
            <span class="commits-text commits-count">Total de x commits</span>
            <span class="commits-text commits-sequence">Sequência: x dias</span>
          </div>

          <div class="stats-classification-progress-bar">
            <span>A+</span>
            <progress value="75" min="0" max="100">75%</progress>
          </div>
        </div>

        <div class="stats">
          <div class="stats-header">
            <span class="stats-text stats-description">Commits</span>
            <span class="stats-text stats-value">155</span>
          </div>

          <progress class="stats-progress" max="100" value="70">70%</progress>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>