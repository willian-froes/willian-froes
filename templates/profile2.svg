<svg
  fill="none"
  width="100%"
  height="280px"
  xmlns="http://www.w3.org/2000/svg"
>
  <foreignObject width="100%" height="280px">
    <div
      xmlns="http://www.w3.org/1999/xhtml"
      style="width: 100%; height: 280px;"
    >
      <style>
        .wrapper {
          box-sizing: border-box;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
        
          font-family:
            "JetBrains Mono",
            "Fira Code",
            "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            monospace;
        }

        .header {
          display: flex;
          background-color: #10131a;
          gap: 10px;
          padding: 0 16px;
          align-items: center;
          height: 46px;
          border: 1px solid #242948;
          border-radius: 6px 6px 0px 0px;
        }

        .window {
          display: flex;
          flex-direction: column;
          background-color: transparent;
          border: 1px solid #242948;
          border-radius: 0px 0px 6px 6px;
          padding: 24px;
          gap: 32px;
        }

        .btn {
          width: 14px;
          height: 14px;
          min-width: 14px;
          border-radius: 50%;
          border: none;
          display: block;
        }

        .btn-close {
          background-color: #ff2b46;
        }

        .btn-minimize {
          background-color: #ffc300;
        }

        .btn-maximize {
          background-color: #00dd48;
        }

        .text {
          font-size: 14px;
        }

        .text-profile {
          color: #7e8bad;
        }

        .text-command {
          font-weight: bold;
          color: #00d5fe;
          border: 2px solid purple;
        }

        .text-welcome {
          border: 2px solid blue;
          display: block;
          flex-shrink: 0;
          height: 80px;
          font-size: clamp(24px, 4vw, 32px);
          line-height: 40px;
          font-weight: 900;
          color: #e5ebfa;
        }

        .text-employee {
          border: 2px solid green;
          display: block;
          flex-shrink: 0;
          height: 48px;
          font-size: clamp(13px, 2vw, 16px);
          line-height: 24px;
          color: #8694b8;
        }

        .container {
          display: flex;
          flex-direction: column;
        }

        .container-sm {
          gap: 12px;
        }

        .container-md {
          gap: 30px;
        }

        .stack {
          display: grid;
          grid-template-columns: 120px 1fr;
          column-gap: 34px;
          font-size: 14px;
        }

        .stack-name {
          font-weight: bold;
        }

        .stack-name--front {
          color: #4506f6;
        }

        .stack-name--mobile {
          color: #9500fa;
        }

        .stack-name--design {
          color: #f2008b;
        }

        .stack-name--search {
          color: #ff1d00;
        }

        .stack-name::before {
          content: "$ ";
        }

        .stack-techs {
          color: #e1e8f6;
        }
      </style>

      <div class="wrapper">
        <div class="header">       
          <div class="btn btn-close"></div>
          <div class="btn btn-minimize"></div>
          <div class="btn btn-maximize"></div>

          <span class="text text-profile">
            willian@github ~
          </span>
        </div>

        <div class="window">
          <span class="text text-command">willian@github: ~$ ./perfil</span>

          <div class="container container-sm">
            <span class="text text-welcome">Olá, me chamo Willian Froes! 👋</span>
            <span class="text text-employee">Desenvolvedor de Software • Designer UX/UI</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>